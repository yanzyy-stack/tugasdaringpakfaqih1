<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Image Gallery</title>
<style media="screen">
div.box{
  box-sizing: border-box;
  width: 200px;
  float: left;
  border: 2px solid #ddd;
  margin: 10px;
}

div.box img{
  display: block;
  width: 100%;
  height: 250px;
  object-fit: cover;
}

div.box:hover{
  border-color: #000;
  box-shadow: 0 0 0 1px #000; /* efek border 3px tanpa menggeser kotak */
}

div.box div.deskripsi{
  padding: 15px;
  text-align: center;
}
</style>
</head>
<body> 
<div class="box"> 
<img src="foto/soeharto.jpg"> 
<div class="deskripsi">Soeharto</div> 
</div> 
<div class="box"> 
<img src="foto/habibi.jpg"> 
<div class="deskripsi">Baharuddin Jusuf Habibi</div> 
</div> 
<div class="box"> 
<img src="foto/gusdur.jpg"> 
<div class="deskripsi">KH. Abdurrahman Wahid</div> 
</div> 
<div class="box"> 
<img src="foto/sby.jpg">
<div class="deskripsi">Susilo Bambang Yudhoyono</div> 
</div> 
<div class="box"> 
<img src="foto/jokowi.jpg"> 
<div class="deskripsi">Ir. H. Joko Widodo</div> 
</div> 
</body>
</html>
